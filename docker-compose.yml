# KiteERP · servicios
# Desarrollo:   docker compose up -d db
# Producción:   docker compose --profile prod up -d --build
services:
  db:
    image: postgres:17-alpine
    container_name: kite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kite}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kite_dev_password}
      POSTGRES_DB: ${DB_NAME:-kite}
      TZ: Europe/Madrid
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=Europe/Madrid
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - kite-db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kite} -d ${DB_NAME:-kite}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-kite}:${DB_PASSWORD:-kite_dev_password}@db:5432/${DB_NAME:-kite}
      STORAGE_DIR: /data/storage
      APP_URL: ${APP_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-cambia-esto-en-produccion}
    volumes:
      - kite-storage:/data/storage

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  kite-db-data:
  kite-storage:
