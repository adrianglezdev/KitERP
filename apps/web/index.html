<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F3F8" />
    <meta name="description" content="KiteERP · gestión integral de la empresa" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <title>KiteERP</title>
    <script>
      // Pinta la marca de la empresa (colores, tipografías y modo) antes de que cargue la aplicación,
      // con lo que se guardó en la visita anterior. src/lib/theme.ts lo actualiza después.
      (function () {
        var fonts = 'https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@400;500;600;700&display=swap';
        var modo = 'sistema';
        try {
          var b = JSON.parse(localStorage.getItem('kite-brand') || 'null');
          if (b && typeof b.css === 'string') {
            var s = document.createElement('style');
            s.id = 'kite-brand-css';
            s.textContent = b.css;
            document.head.appendChild(s);
          }
          if (b && typeof b.fonts === 'string' && b.fonts.indexOf('https://fonts.googleapis.com/css2?') === 0) fonts = b.fonts;
          if (b && b.modo) modo = b.modo;
          if (b && b.apariencia && b.apariencia.nombreApp) document.title = b.apariencia.nombreApp;
          else if (b && b.nombre) document.title = b.nombre;
        } catch (e) {}
        var l = document.createElement('link');
        l.id = 'kite-brand-fonts';
        l.rel = 'stylesheet';
        l.href = fonts;
        document.head.appendChild(l);
        var t = null;
        try {
          t = localStorage.getItem('kite-theme');
        } catch (e) {}
        var dark = t === 'dark' || (t !== 'light' && (modo === 'oscuro' || (modo !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches)));
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
